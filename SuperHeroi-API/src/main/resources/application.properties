spring.application.name=superhero

# Banco de dados H2 em memória
spring.datasource.url=jdbc:h2:mem:superhero-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / Springdoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Rate Limiting pequeno por cliente/IP
# Permite 5 requisições a cada 60 segundos.
# Ao exceder, retorna 429 com Retry-After.
app.rate-limit.max-requests=100
app.rate-limit.window-seconds=60


# CORS
# Configurado em senac.tsi.superhero.config.CorsConfig
# Origens permitidas: localhost:3000, 5173, 8080 e 4200
# Métodos permitidos: GET, POST, PUT, DELETE e OPTIONS
